[package]
name = "tiny-media-center"
version = "0.1.1"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
sdl3 = "0.14"
femtovg = "0.11"
libmpv2 = { version = "4", features = ["render"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
fastrand = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "3", features = ["json"] }
x11rb = "0.14.0"
zbus = "6.1.0"
zruntime = "0.2"
notify = "8.2.1"

[features]
# System SDL3 by default; the portable release binary links it statically.
default = []
vendored-sdl = ["sdl3/build-from-source-static"]

[profile.release]
lto = true
strip = true
